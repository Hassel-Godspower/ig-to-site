<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Gòke App</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header class="container">
    <nav class="navbar">
      <a href="index.html" class="brand">Gòke App</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="pricing.html">Pricing</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <a href="pricing.html" class="btn btn-primary">Get Started</a>
    </nav>
  </header>

  <main class="container section">
    <div class="section-title">
      <h2>Get in Touch</h2>
      <p>Questions about enterprise licensing or API integration? We're here to help.</p>
    </div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <form>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Work Email</label>
          <input type="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Inquiry</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container footer-bottom">&copy; 2026 Gòke App. All rights reserved.</div>
  </footer>
  <script src="assets/js/main.js"></script>
</body>
</html>

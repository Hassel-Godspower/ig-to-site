<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5e7f4"/><stop offset=".55" stop-color="#ead9ee"/><stop offset="1" stop-color="#e7d9e7"/></linearGradient>
  <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffd45a"/><stop offset=".28" stop-color="#ed4b67"/><stop offset=".62" stop-color="#c62a8f"/><stop offset="1" stop-color="#5b35c8"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8c1b1"/><stop offset=".45" stop-color="#a47b6b"/><stop offset="1" stop-color="#3d2927"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#eadbcb"/></linearGradient>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Ade · Coach: Instagram to website">
  <defs>
    <linearGradient id="ig-fitness" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="50%" stop-color="#dd2a7b"/>
      <stop offset="100%" stop-color="#8134af"/>
    </linearGradient>
    <filter id="sh-fitness" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="#f3e8ff"/>
  <!-- IG card -->
  <g filter="url(#sh-fitness)">
    <rect x="36" y="40" width="340" height="440" rx="16" fill="#ffffff"/>
    <!-- header -->
    <circle cx="88" cy="100" r="28" fill="url(#ig-fitness)"/>
    <circle cx="88" cy="100" r="24" fill="#e5e7eb"/>
    <text x="130" y="92" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#111">@coach.ade</text>
    <text x="130" y="112" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Ade · Coach</text>
    <!-- stats -->
    <text x="60" y="160" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#111">248</text>
    <text x="60" y="176" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280">posts</text>
    <text x="130" y="160" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#111">12.4k</text>
    <text x="130" y="176" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280">followers</text>
    <text x="220" y="160" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#111">890</text>
    <text x="220" y="176" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280">following</text>
    <!-- bio -->
    <text x="60" y="210" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#111">Strength & fat-loss for busy adults</text>
    <text x="60" y="228" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Lagos, NG</text>
    <text x="60" y="248" font-family="system-ui,sans-serif" font-size="10" fill="#2563eb">coach.ade.com</text>
    <!-- buttons -->
    <rect x="60" y="265" width="120" height="28" rx="8" fill="#2563eb"/>
    <text x="120" y="283" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Follow</text>
    <rect x="190" y="265" width="120" height="28" rx="8" fill="#e5e7eb"/>
    <text x="250" y="283" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#111">Message</text>
    <!-- grid posts -->
    <rect x="60" y="310" width="80" height="80" rx="4" fill="#dbeafe"/>
    <rect x="150" y="310" width="80" height="80" rx="4" fill="#fce7f3"/>
    <rect x="240" y="310" width="80" height="80" rx="4" fill="#d1fae5"/>
    <rect x="60" y="400" width="80" height="60" rx="4" fill="#fef3c7"/>
    <rect x="150" y="400" width="80" height="60" rx="4" fill="#e0e7ff"/>
    <rect x="240" y="400" width="80" height="60" rx="4" fill="#ffedd5"/>
  </g>
  <!-- Arrow -->
  <path d="M400 250 C430 220, 450 220, 480 250" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <path d="M468 238 L488 250 L468 262" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- IG glyph -->
  <rect x="430" y="160" width="36" height="36" rx="10" fill="url(#ig-fitness)"/>
  <rect x="438" y="168" width="20" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="448" cy="178" r="4" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Website card -->
  <g filter="url(#sh-fitness)">
    <rect x="500" y="50" width="360" height="420" rx="12" fill="#0a0a0a"/>
    <rect x="500" y="50" width="360" height="36" rx="12" fill="#171717"/>
    <circle cx="520" cy="68" r="5" fill="#f87171"/>
    <circle cx="536" cy="68" r="5" fill="#fbbf24"/>
    <circle cx="552" cy="68" r="5" fill="#34d399"/>
    <!-- hero -->
    <rect x="500" y="86" width="360" height="200" fill="#1c1917"/>
    <text x="680" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#ffffff">ADE FITNESS</text>
    <text x="680" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Real training · Real results</text>
    <rect x="630" y="225" width="100" height="28" rx="6" fill="#ffffff"/>
    <text x="680" y="243" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#0a0a0a">Book a session</text>
    <!-- gallery strip -->
    <text x="520" y="320" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#f3f4f6">GALLERY</text>
    <rect x="520" y="335" width="100" height="70" rx="4" fill="#262626"/>
    <rect x="630" y="335" width="100" height="70" rx="4" fill="#262626"/>
    <rect x="740" y="335" width="100" height="70" rx="4" fill="#262626"/>
    <rect x="520" y="420" width="320" height="30" rx="4" fill="#171717"/>
  </g>
</svg>